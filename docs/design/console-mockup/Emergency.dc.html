<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emergency alert</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bolnai/tokens.css">
<link rel="stylesheet" href="ds/bolnai/components/bundle.css">
<script src="ds/bolnai/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-sans)">

  <sc-if value="{{showBanner}}" hint-placeholder-val="{{true}}">
    <div style="padding: 12px 24px; background: var(--canvas)">
      <x-import component-from-global-scope="Bolnai.EmergencyBanner" kind="medical" time="6:11 pm · 1 min ago" number="+91 98777 77777" language="Hinglish" verified="{{no}}" snippet="Mere papa ko seene mein dard hai, jaldi kuch kijiye" steps="{{steps}}" open-href="Calls.dc.html" is-new="{{yes}}" on-acknowledge="{{ack}}"></x-import>
    </div>
  </sc-if>

  <sc-if value="{{ackedByCall}}" hint-placeholder-val="{{false}}">
    <div style="padding: 12px 24px; background: var(--canvas)">
      <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-radius: var(--radius-lg); background: var(--emergency-soft); color: var(--ink)">
        <x-import component-from-global-scope="Bolnai.PriorityMark" level="P1" quiet="{{yes}}"></x-import>
        <span class="body bn-num" style="flex: 1 1 320px">Simran Arora called back at 6:12 pm, which acknowledged the 6:11 pm emergency. P1 callback in progress.</span>
        <a href="Callbacks.dc.html" class="label" style="color: var(--accent)">Open callbacks</a>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ackedByButton}}" hint-placeholder-val="{{false}}">
    <div style="padding: 12px 24px; background: var(--canvas)">
      <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-radius: var(--radius-lg); background: var(--emergency-soft); color: var(--ink)">
        <x-import component-from-global-scope="Bolnai.PriorityMark" level="P1" quiet="{{yes}}"></x-import>
        <span class="body bn-num" style="flex: 1 1 320px">Emergency at 6:11 pm acknowledged by Simran Arora at 6:12 pm. P1 callback still open, due by 6:26 pm.</span>
        <a href="Callbacks.dc.html" class="label" style="color: var(--accent)">Open callbacks</a>
      </div>
    </div>
  </sc-if>

  <dc-import name="TopBar" time="6:11 pm" p1="1" hint-size="100%,120px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; align-items: stretch">
    <div style="flex: 1 1 176px; min-width: 0; background: var(--surface); border-right: 1px solid var(--line)">
      <dc-import name="Rail" active="today" callbacks="5" hint-size="100%,560px"></dc-import>
    </div>
    <main style="flex: 999 1 560px; min-width: 0">
      <dc-import name="TodayBody" hint-size="100%,1180px"></dc-import>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const acked = !!s.acked;
    return {
      yes: true,
      no: false,
      steps: [
        { state: 'done', text: 'Told the caller to ring 112 or 108' },
        { state: 'failed', text: 'Transfer to the desk: no answer' },
        { state: 'next', text: 'P1 callback due by 6:26 pm · in 15 min' }
      ],
      showBanner: !acked,
      ackedByCall: acked && s.via === 'call_back',
      ackedByButton: acked && s.via !== 'call_back',
      ack: (info) => this.setState({ acked: true, via: info && info.via })
    };
  }
}
</script>
</body>
</html>
