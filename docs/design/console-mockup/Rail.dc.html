<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Left rail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bolnai/tokens.css">
<link rel="stylesheet" href="ds/bolnai/components/bundle.css">
<script src="ds/bolnai/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; color: var(--ink); font-family: var(--font-sans)">
  <div style="display: flex; flex-wrap: wrap; gap: 4px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="7">
      <sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
        <a href="{{item.href}}" aria-current="page" class="body-strong" style="flex: 1 1 140px; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent); text-decoration: none">
          <span>{{item.label}}</span>
          <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
            <span class="label bn-num" style="min-width: 24px; height: 22px; box-sizing: border-box; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--surface); color: var(--accent)">{{item.count}}</span>
          </sc-if>
        </a>
      </sc-if>
      <sc-if value="{{item.inactive}}" hint-placeholder-val="{{true}}">
        <a href="{{item.href}}" class="body" style="flex: 1 1 140px; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: var(--radius-md); color: var(--ink); text-decoration: none">
          <span>{{item.label}}</span>
          <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
            <span class="label bn-num" style="min-width: 24px; height: 22px; box-sizing: border-box; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--neutral-soft); color: var(--ink)">{{item.count}}</span>
          </sc-if>
        </a>
      </sc-if>
    </sc-for>
  </div>
  <div style="padding: 12px 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
    <span class="body-strong">Simran Arora</span>
    <span class="caption bn-muted">Receptionist · front desk PC</span>
    <x-import component-from-global-scope="Bolnai.Button" variant="quiet" style="margin-top: 4px">Switch user</x-import>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","bookings","callbacks","calls","payments","messages","patients"],"default":"today"},"callbacks":{"editor":"int","default":4,"min":0},"$preview":{"width":176,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const cb = Number(this.props.callbacks ?? 4) || 0;
    const base = [
      { key: 'today', label: 'Today', href: 'Main.dc.html', count: 0 },
      { key: 'bookings', label: 'Bookings', href: '#', count: 0 },
      { key: 'callbacks', label: 'Callbacks', href: 'Callbacks.dc.html', count: cb },
      { key: 'calls', label: 'Calls', href: 'Calls.dc.html', count: 0 },
      { key: 'payments', label: 'Payments', href: '#', count: 1 },
      { key: 'messages', label: 'Messages', href: '#', count: 2 },
      { key: 'patients', label: 'Patients', href: '#', count: 0 }
    ];
    return {
      items: base.map((i) => ({
        label: i.label,
        href: i.href,
        count: i.count,
        hasCount: i.count > 0,
        active: i.key === active,
        inactive: i.key !== active
      }))
    };
  }
}
</script>
</body>
</html>
