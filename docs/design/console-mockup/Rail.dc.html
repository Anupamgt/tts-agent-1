<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Left rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=STIX+Two+Text:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:176px;height:980px;box-sizing:border-box;display:flex;flex-direction:column;background:#f5f4f0;border-right:1px solid #1a1a1a;color:#111;font-family:Verdana,'DejaVu Sans','Noto Sans',sans-serif">
  <div style="height:100px;flex:none;box-sizing:border-box;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-bottom:1px solid #1a1a1a">
    <span style="font-family:'STIX Two Text','Times New Roman',serif;font-weight:700;font-size:22px;line-height:26px">Front desk</span>
    <span style="font-size:11px;line-height:14px;color:#55534e">Voice agent console</span>
  </div>
  <nav aria-label="Main" style="display:flex;flex-direction:column;gap:2px;padding:12px 0">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
      <sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
        <a href="#" aria-current="page" style="display:flex;align-items:center;justify-content:space-between;height:44px;box-sizing:border-box;padding:0 14px 0 20px;margin-left:8px;margin-right:-1px;background:#fff;border:1px solid #1a1a1a;border-right:0;color:#111;font-size:14px;font-weight:700;text-decoration:none;position:relative">
          <span>{{item.label}}</span>
          <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;min-width:20px;height:20px;box-sizing:border-box;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid #1a1a1a;color:#111">{{item.count}}</span></sc-if>
        </a>
      </sc-if>
      <sc-if value="{{item.inactive}}" hint-placeholder-val="{{true}}">
        <a href="#" style="display:flex;align-items:center;justify-content:space-between;height:44px;box-sizing:border-box;padding:0 20px;margin-left:8px;border:1px solid transparent;color:#111;font-size:14px;text-decoration:none">
          <span>{{item.label}}</span>
          <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;min-width:20px;height:20px;box-sizing:border-box;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid #1a1a1a;color:#111">{{item.count}}</span></sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
  <div style="margin-top:auto;padding:16px 20px;border-top:1px solid #d4d2cc;display:flex;flex-direction:column;gap:2px">
    <span style="font-size:13px;font-weight:700;line-height:16px">Simran Arora</span>
    <span style="font-size:11px;line-height:14px;color:#55534e">Reception · at the desk</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","bookings","callbacks","calls","payments","messages","patients","settings"],"default":"today"},"callbacks":{"editor":"int","default":4,"min":0},"$preview":{"width":176,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const cb = Number(this.props.callbacks ?? 4);
    const base = [
      { key: 'today', label: 'Today', count: 0 },
      { key: 'bookings', label: 'Bookings', count: 0 },
      { key: 'callbacks', label: 'Callbacks', count: cb },
      { key: 'calls', label: 'Calls', count: 0 },
      { key: 'payments', label: 'Payments', count: 1 },
      { key: 'messages', label: 'Messages', count: 3 },
      { key: 'patients', label: 'Patients', count: 0 },
      { key: 'settings', label: 'Settings', count: 0 }
    ];
    return {
      items: base.map((i) => ({
        key: i.key,
        label: i.label,
        count: i.count,
        hasCount: i.count > 0,
        active: i.key === active,
        inactive: i.key !== active
      }))
    };
  }
}
</script>
</body>
</html>
