<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bolnai/tokens.css">
<link rel="stylesheet" href="ds/bolnai/components/bundle.css">
<script src="ds/bolnai/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<header style="box-sizing: border-box; width: 100%; background: var(--surface); color: var(--ink); font-family: var(--font-sans); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-raised)">
  <div style="box-sizing: border-box; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
    <div style="display: flex; align-items: baseline; gap: 8px; flex: none">
      <span class="heading">Demo Family Clinic</span>
      <span class="caption bn-muted">· Bolnai</span>
    </div>
    <div style="display: flex; flex-direction: column; flex: none">
      <span class="label bn-num">Mon, 19 Oct · {{time}}</span>
      <span class="caption" style="display: flex; align-items: center; gap: 6px; color: var(--ok-ink)"><span style="width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--ok)"></span>Agent: 2 calls in progress</span>
    </div>
    <label style="flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface)">
      <input type="search" aria-label="Search patients by ID, name or phone" class="body" placeholder="Patient ID, name or phone" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink)">
      <span class="caption bn-muted" style="padding: 0 6px; border: 1px solid var(--line); border-radius: var(--radius-sm)">/</span>
    </label>
    <x-import component-from-global-scope="Bolnai.DeskSwitch" on="{{deskOn}}"></x-import>
    <div role="group" aria-label="Console language" style="display: flex; flex: none; height: 40px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: var(--radius-md); overflow: hidden">
      <button type="button" aria-pressed="true" class="label" style="padding: 0 14px; border: 0; background: var(--accent-soft); color: var(--accent); cursor: pointer">English</button>
      <button type="button" aria-pressed="false" lang="hi" class="hi-label" style="padding: 0 14px; border: 0; border-left: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer">हिंदी</button>
    </div>
  </div>
  <div style="box-sizing: border-box; padding: 8px 24px 10px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
    <span class="caption bn-muted">In session</span>
    <x-import component-from-global-scope="Bolnai.DoctorChip" name="Dr Sharma" delay-min="{{d25}}" basis="live" status="started"></x-import>
    <x-import component-from-global-scope="Bolnai.DoctorChip" name="Dr Verma" delay-min="{{d0}}" basis="schedule" status="started" title="No tap from the cabin for 32 min"></x-import>
    <x-import component-from-global-scope="Bolnai.DoctorChip" name="Dr Kaur" delay-min="{{d10}}" basis="live" status="started"></x-import>
    <nav aria-label="Needs you" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <sc-if value="{{hasP1}}" hint-placeholder-val="{{false}}">
        <a href="Callbacks.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--ink); text-decoration: none">
          <x-import component-from-global-scope="Bolnai.PriorityMark" level="P1"></x-import>
          <span class="label bn-num">{{p1}} new</span>
        </a>
      </sc-if>
      <a href="Callbacks.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--ink); text-decoration: none">
        <span class="label">Callbacks</span>
        <span class="label bn-num">{{cbCount}}</span>
        <x-import component-from-global-scope="Bolnai.StatusBadge" tone="attention" icon="clock">1 overdue</x-import>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--ink); text-decoration: none">
        <span class="label">Refunds</span>
        <span class="label bn-num">1</span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--ink); text-decoration: none">
        <span class="label">Failed SMS</span>
        <span class="label bn-num" style="color: var(--attention-ink)">3</span>
      </a>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"time":{"editor":"text","default":"6:10 pm"},"p1":{"editor":"int","default":0,"min":0,"max":3},"deskOn":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const p1 = Number(this.props.p1 ?? 0) || 0;
    const desk = this.props.deskOn;
    return {
      time: this.props.time ?? '6:10 pm',
      deskOn: desk === undefined ? true : desk !== false && desk !== 'false',
      p1: p1,
      hasP1: p1 > 0,
      cbCount: 4 + p1,
      d25: 25,
      d0: 0,
      d10: 10
    };
  }
}
</script>
</body>
</html>
