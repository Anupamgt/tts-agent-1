<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo phone · Deskie</title>
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/png/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="brand/png/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="brand/png/favicon-180.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/console.css">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <main style="max-width: 36rem; margin: 2rem auto; padding: 0 1rem;">
    <h1>Demo phone</h1>
    <p>Calls the clinic from this browser. The call runs in a LiveKit room: Deskie hears you through Gnani Prisma and answers in Gnani Timbre. Pick who is calling, allow the microphone, and speak after the greeting.</p>
    <div id="people" role="group" aria-label="Who is calling"></div>
    <p id="status" role="status" aria-live="polite" style="margin: 0.5rem 0;">Not in a call.</p>
    <button type="button" id="hangup" class="bn-btn" style="display: none; margin-bottom: 0.5rem;">Hang up</button>
    <pre id="log" role="log" aria-live="polite" aria-label="Call transcript" style="white-space: pre-wrap;"></pre>
    <div id="audio"></div>
  </main>
  <script>
    var logEl = document.getElementById('log');
    var statusEl = document.getElementById('status');
    var hangupBtn = document.getElementById('hangup');
    var room = null;
    function log(line) { logEl.textContent += line + '\n'; }
    function status(text) { statusEl.textContent = text; }
    async function api(path, body, headers) {
      var res = await fetch(path, {
        method: body ? 'POST' : 'GET',
        credentials: 'same-origin',
        headers: Object.assign(body ? { 'Content-Type': 'application/json' } : {}, headers || {}),
        body: body ? JSON.stringify(body) : undefined
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.detail || res.statusText);
      return data;
    }
    var STATES = { initializing: 'Deskie is joining…', listening: 'Deskie is listening', thinking: 'Deskie is thinking…', speaking: 'Deskie is speaking' };
    async function start(persona) {
      if (room) { log('Hang up the current call first.'); return; }
      if (!window.LivekitClient) { log('The LiveKit client did not load. Check the network and reload.'); return; }
      var LK = window.LivekitClient;
      log('Calling as ' + persona + '…');
      var call = await api('/api/calls', { persona_key: persona });
      log('Call ' + call.call_id + ' · files on this number: ' + call.patient_count);
      room = new LK.Room({ adaptiveStream: true, dynacast: true });
      room.on(LK.RoomEvent.TrackSubscribed, function (track) {
        if (track.kind === 'audio') document.getElementById('audio').appendChild(track.attach());
      });
      room.on(LK.RoomEvent.ParticipantConnected, function (p) {
        if (p.kind === LK.ParticipantKind.AGENT || p.identity.indexOf('agent') === 0) log('Deskie joined the call.');
        else log(p.identity + ' joined the call.');
      });
      room.on(LK.RoomEvent.ParticipantAttributesChanged, function (changed, p) {
        if (changed['lk.agent.state'] && STATES[changed['lk.agent.state']]) status(STATES[changed['lk.agent.state']]);
      });
      room.on(LK.RoomEvent.TranscriptionReceived, function (segments, p) {
        segments.forEach(function (s) {
          if (s.final) log((p && p.identity === room.localParticipant.identity ? 'You: ' : 'Deskie: ') + s.text);
        });
      });
      room.on(LK.RoomEvent.Disconnected, function () {
        log('Call ended.');
        status('Not in a call.');
        hangupBtn.style.display = 'none';
        document.getElementById('audio').innerHTML = '';
        room = null;
      });
      status('Connecting…');
      await room.connect(call.livekit_url, call.livekit_token);
      await room.startAudio();
      await room.localParticipant.setMicrophoneEnabled(true);
      hangupBtn.style.display = '';
      status('Connected. Waiting for Deskie…');
    }
    hangupBtn.addEventListener('click', function () { if (room) room.disconnect(); });
    api('/api/personas').then(function (rows) {
      var box = document.getElementById('people');
      rows.forEach(function (row) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'bn-btn bn-btn-primary';
        button.style.margin = '0 0.5rem 0.5rem 0';
        button.textContent = row.display_name;
        button.addEventListener('click', function () {
          start(row.key).catch(function (err) { log(err.message); status('Not in a call.'); if (room) room.disconnect(); });
        });
        box.appendChild(button);
      });
    }).catch(function (err) { log(err.message); });
  </script>
</body>
</html>
