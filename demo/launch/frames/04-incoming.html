<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phone.css">
  <style>
    body { background: #0e1418; color: #fff; }
    .incoming { text-align: center; font-size: 42px; font-weight: 500; opacity: 0.7; margin: 280px 0 24px; }
    .actions {
      margin-top: auto; display: flex; justify-content: space-between; padding: 0 150px 48px;
    }
    .act { display: flex; flex-direction: column; align-items: center; }
    .decline { background: #ff453a; }
    .answer { background: #30d158; }
    .home { color: #fff; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="status">
      <div class="time">6:10</div>
      <div class="glyphs">
        <svg width="48" height="32" viewBox="0 0 48 32" fill="currentColor" aria-hidden="true"><rect x="0" y="20" width="8" height="12" rx="1"/><rect x="13" y="14" width="8" height="18" rx="1"/><rect x="26" y="7" width="8" height="25" rx="1"/><rect x="39" y="0" width="8" height="32" rx="1"/></svg>
        <svg width="46" height="34" viewBox="0 0 46 34" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><path d="M8 16c8-8 22-8 30 0"/><path d="M14 22c5-5 13-5 18 0"/><circle cx="23" cy="28" r="2.5" fill="currentColor" stroke="none"/></svg>
        <svg width="72" height="34" viewBox="0 0 72 34" aria-hidden="true"><rect x="1" y="1" width="60" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><rect x="5" y="5" width="52" height="24" rx="3" fill="currentColor"/><rect x="64" y="11" width="6" height="12" rx="2" fill="currentColor"/></svg>
      </div>
    </div>
    <p class="incoming">incoming call</p>
    <h1 class="name">Deskie</h1>
    <p class="sub">Clinic</p>
    <div class="actions">
      <div class="act">
        <button class="circle decline" aria-label="Decline">
          <svg width="84" height="84" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .7-.3 1L6.6 10.8z"/></svg>
        </button>
        <div class="cap">Decline</div>
      </div>
      <div class="act">
        <button class="circle answer" aria-label="Answer">
          <svg width="84" height="84" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .7-.3 1L6.6 10.8z"/></svg>
        </button>
        <div class="cap">Answer</div>
      </div>
    </div>
    <div class="home"><i></i></div>
  </div>
</body>
</html>
