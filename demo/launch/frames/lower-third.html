<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1920px; height: 140px; background: transparent; }
    body { display: flex; align-items: flex-end; padding: 0 0 36px 64px; box-sizing: border-box; }
    .bar {
      display: inline-flex; align-items: center; gap: 14px;
      background: #13232b; color: #fff; border-radius: 10px;
      padding: 14px 22px; font-family: "Anek Latin", sans-serif;
      font-size: 32px; font-weight: 600; letter-spacing: -0.02em;
    }
    .bar i { width: 10px; height: 10px; border-radius: 99px; background: #7dcec4; display: block; }
  </style>
</head>
<body><div class="bar"><i></i>Deskie · Deskie</div></body>
</html>
